name: Foundation CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: "25"
          cache: maven

      - name: Verify service
        run: ./mvnw --batch-mode clean verify

      - name: Verify repository policy
        run: bash scripts/verify-repository-policy.sh

      - name: Upload quality evidence
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: quality-evidence-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            target/foundation-evidence/
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
            target/classes/META-INF/sbom/

      - name: Upload application artifact
        if: success()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: application-${{ github.sha }}
          if-no-files-found: error
          retention-days: 14
          path: target/*.jar
